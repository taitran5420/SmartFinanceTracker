global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Four things this stack needs scraped, all reachable by container name over
# the Compose network (docker-compose.ec2.yml adds all of these as internal-only
# services — none of these ports are published to the EC2 host):
#   - prometheus itself, on its own default port 9090
#   - app (Spring Boot), Micrometer's Prometheus endpoint at :9091/actuator/prometheus
#     (port 9091 because management.server.port is set separately from the
#     app's main port 8080 — see application.yaml)
#   - node-exporter, host-level metrics (CPU/mem/disk), default port 9100
#   - cadvisor, per-container metrics, default port 8080
#
# TODO(human): write the scrape_configs list below. Each entry needs a
# `job_name` and a `static_configs: - targets: [...]` pointing at one of the
# four addresses above. Job names show up as the `job` label in Grafana, so
# pick something readable (e.g. "spring-boot", "node", "cadvisor",
# "prometheus"). The app's job also needs `metrics_path: /actuator/prometheus`
# since Prometheus defaults to scraping `/metrics` otherwise.
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'backend-app'
    static_configs:
      - targets: [ 'app:9091' ]
    metrics_path: /actuator/prometheus

  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]

  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor:8080' ]