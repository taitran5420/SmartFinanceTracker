version: '3.8'

# Standalone prod compose file for the EC2 host — deliberately NOT merged with
# docker-compose.yml. Only what should actually run in prod: no kafka-ui, no
# redisinsight (dev-only tooling), app pulls a prebuilt ECR image instead of
# building from source. Run with: docker compose -f docker-compose.ec2.yml
# --profile full up -d  (mirrors the local `--profile full` convention).

# Shared CloudWatch Logs config (Phase 6) — one log group for the whole host,
# streams distinguished by container name via `tag`. The log group is
# pre-created manually (see tracking doc) rather than via `awslogs-create-group`
# — that option makes every container race to CreateLogGroup on a cold start
# (Compose starts most services in parallel), and CloudWatch's CreateLogGroup
# API 400s with OperationAbortedException on concurrent calls for the same
# name. Pre-creating once avoids the race entirely and is also where
# retention gets set (the driver can never set retention itself either way).
x-logging: &awslogs
  driver: awslogs
  options:
    awslogs-region: ap-southeast-1
    awslogs-group: /smartfinancetracker/ec2
    tag: "{{.Name}}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_finance_db
    restart: always
    logging: *awslogs
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # no ports: — only reachable from other containers on this Compose network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: smart_finance_kafka
    restart: always
    logging: *awslogs
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    # No host port mapping: the app reaches Kafka over the internal Compose
    # network at kafka:29092. Nothing outside this host needs port 9092.

  redis:
    image: redis:7-alpine
    container_name: smart_finance_redis
    restart: always
    logging: *awslogs
    volumes:
      - redis_data:/data
    # No host port mapping, same reasoning as kafka above.

  app:
    image: 310697202929.dkr.ecr.ap-southeast-1.amazonaws.com/smartfinancetracker-backend:latest
    container_name: smart_finance_app
    restart: always
    profiles: ["full"]
    logging: *awslogs
    depends_on:
      - postgres
      - kafka
      - redis
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_DATABASE}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"

  frontend:
    image: 310697202929.dkr.ecr.ap-southeast-1.amazonaws.com/smartfinancetracker-frontend:latest
    container_name: smart_finance_frontend
    restart: always
    profiles: ["full"]
    logging: *awslogs
    depends_on:
      - app
      - grafana
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Not secrets (they're public DNS names) — plain values here rather
      # than routed through .env. Fill in with the actual DuckDNS domains.
      DUCKDNS_DOMAIN: smartfinance.duckdns.org
      GRAFANA_DUCKDNS_DOMAIN: smartfinance-grafana.duckdns.org
    volumes:
      # Persists Caddy's issued cert + ACME account state across container
      # recreates (every deploy). Without this, each `docker compose up`
      # after an image update would make Caddy re-request a cert from
      # Let's Encrypt instead of reusing the one it already has.
      - caddy_data:/data
      - caddy_config:/config
    # Caddy resolves the app/grafana hostnames via Docker's DNS at startup
    # to proxy to them, which is why depends_on matters here.

  prometheus:
    image: prom/prometheus:latest
    container_name: smart_finance_prometheus
    restart: always
    profiles: ["full"]
    logging: *awslogs
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # No ports: — only Grafana (over the internal Compose network) queries
    # this, same internal-only convention as postgres/kafka/redis above.
    # Prometheus's own bare UI is deliberately never reachable from outside.

  grafana:
    image: grafana/grafana:latest
    container_name: smart_finance_grafana
    restart: always
    profiles: ["full"]
    logging: *awslogs
    depends_on:
      - prometheus
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    # No ports: — reached only via Caddy's reverse proxy (frontend service),
    # over its own DuckDNS subdomain. Never bound to the host's interface.

  node-exporter:
    image: prom/node-exporter:latest
    container_name: smart_finance_node_exporter
    restart: always
    profiles: ["full"]
    logging: *awslogs
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # No ports: — scraped internally by Prometheus at node-exporter:9100.

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: smart_finance_cadvisor
    restart: always
    profiles: ["full"]
    logging: *awslogs
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    # No ports: — scraped internally by Prometheus at cadvisor:8080.

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
