spring:
  application:
    name: smartfinancetracker
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${ACTIVE_PROFILE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            isClustered: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    consumer:
      group-id: smart-finance-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  servlet:
    context-path: /api

# Separate port from `server.port` (default 8080) — Spring Boot serves actuator
# on its own embedded connector here, outside SecurityConfiguration's JWT filter
# chain entirely (that chain only wires up on the main server port). Safe to
# leave unauthenticated because this port is never published to the Docker
# host in docker-compose.ec2.yml, so only containers on the internal Compose
# network (i.e. Prometheus) can ever reach it.
management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,prometheus

springdoc:
  api-docs:
    path: /openapi.json

scalar:
  path: /docs
  theme: blue_planet

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

recurring:
  cron: ${RECURRING_CRON:0 0/5 * * * ?}

logging:
  level:
    org.flywaydb: DEBUG